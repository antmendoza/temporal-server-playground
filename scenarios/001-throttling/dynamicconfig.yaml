# Throttling lab — see scenarios/001-throttling/README.md for the full walkthrough.
#
# Starts at baseline (no knob active). For each exercise, uncomment ONE block below in
# config/dynamicconfig/development.yaml, run `make dynconfig`, wait ~2 min, then comment it out again.

limit.maxIDLength:
  - value: 255
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev only — do not use in production
    constraints: {}

# Load: serverless_burst, 10 x 0.2s activities per workflow, rps=25, concurrent=50; worker pollers=50.
# Baseline at that load: frontend ~590 req/s; persistence QPS history ~1,280, frontend ~76.
# Each limit is about half of the baseline usage. Measured signals are in the README.

# ── Exercise 1: frontend namespace RPS (default 2400) ────────────────────────────
# Signal: frontend · Namespace · RpsLimit on PollWorkflowExecutionHistory; throughput 25 → ~12.5/s.
#frontend.namespaceRPS:
#  - value: 295
#    constraints: {}

# ── Exercise 2: frontend concurrent long-polls (default 1200) ────────────────────
# Signal: frontend · Namespace · ConcurrentLimit on worker and client polls; workflow backlog grows,
#   starts drop to ~1/s. (At 20 or 10 there are many rejections but no impact.)
#frontend.namespaceCount:
#  - value: 2
#    constraints: {}

# ── Exercise 3: history persistence QPS (default 9000) ───────────────────────────
# Signal: persistence_errors_resource_exhausted{service_name="history"} (System scope);
#   completions 25 → ~12/s, workflow task schedule-to-start p99 ~3s.
#history.persistenceMaxQPS:
#  - value: 638
#    constraints: {}

# ── Exercise 4: frontend persistence QPS (default 2000) — revert promptly ────────
# Signal: frontend · System · PersistenceLimit on StartWorkflowExecution; completions 25 → ~2.5/s.
#frontend.persistenceMaxQPS:
#  - value: 37
#    constraints: {}
