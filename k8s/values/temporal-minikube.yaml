# In-cluster PostgreSQL + Elasticsearch from the deps chart; wiped with the namespace on every scenario
server:
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            databaseName: temporal
            connectAddr: "postgresql:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
        visibility:
          elasticsearch:
            manageSchema: true
            version: v7
            url:
              scheme: http
              host: "elasticsearch:9200"
            logLevel: error
            indices:
              visibility: temporal_visibility_v1_dev
