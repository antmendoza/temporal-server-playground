# History queues lab — see scenarios/002-history-queues/README.md for the full walkthrough.
#
# Starts at baseline (no knob active). For each exercise, uncomment ONE block below in
# config/dynamicconfig/development.yaml, run `make dynconfig`, wait ~2 min, then comment it out again
# and wait for the backlog to drain before the next one.

limit.maxIDLength:
  - value: 255
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev only — do not use in production
    constraints: {}

# ── Exercise 1: starve the transfer queue reader (default 0 = unlimited) ─────────
# Signal: task_latency_queue for Transfer* tasks → ~100s; task_latency_schedule stays ~0.
#   Workers idle, workflow task schedule-to-start ~10s, completions 60 → ~1.5/s.
history.transferProcessorMaxPollHostRPS:
  - value: 1
    constraints: {}

# ── Exercise 2: starve the timer queue reader (default 0 = unlimited) ────────────
# Signal: task_latency_queue for Timer* tasks → ~70s; Transfer clean, schedule-to-start low.
#   Timers fire late: workflows take far longer, completions 60 → ~2/s.
#history.timerProcessorMaxPollHostRPS:
#  - value: 1
#    constraints: {}

# ── Exercise 3: starve the visibility queue reader (default 0 = unlimited) ───────
# Signal: task_latency_queue for Visibility* tasks → ~50s; workflows unaffected (60/s).
#   List/Count fall behind reality: new workflows appear late, ~5x fewer than actually ran.
#history.visibilityProcessorMaxPollHostRPS:
#  - value: 1
#    constraints: {}

# ── Exercise 4: shrink the transfer worker pool (default 512) ────────────────────
# Signal: task_latency_schedule for Transfer* rises slightly (~0.001 → ~0.01s) and nothing else:
#   one worker keeps up with ~180 tasks/s here. The pool is rarely the bottleneck.
#history.transferProcessorSchedulerWorkerCount:
#  - value: 1
#    constraints: {}
