# Scenario 1: Frontend Rate Limiting
#
# Aggressively throttles frontend calls per namespace to trigger
# RESOURCE_EXHAUSTED on the lowest-priority operations first.
#
# Expected:
#   - ResourceExhausted on PollWorkflowTaskQueue / PollActivityTaskQueue first
#     (lowest priority in frontend quotas; StartWorkflow / Signal survive longer).
#     See https://github.com/temporalio/temporal/blob/main/service/frontend/configs/quotas.go
#   - schedule_to_start latency climbs for workflow tasks and activities — the
#     server has work to dispatch but the dispatch RPCs are being throttled.
#   - service_errors_resource_exhausted with cause=RpsLimit on the frontend.
#
# How to reproduce:
#   make scenario-frontend-rate-limit-001
#   # in another terminal:
#   make worker
#   # in another terminal — drive enough RPS to exceed 50 namespaceRPS:
#   make starter w=200 a=5 c=3 intervalMs=20 iterations=10
#
# Dashboard: Grafana → "Scenario-Frontend Rate Limiting"
#
# Knobs:
#   frontend.namespaceRPS — per-frontend-host RPS limit for a single namespace.
#     Default 1200. Set to 50 so a modest worker poll loop will saturate it.
#   frontend.rps          — per-host total RPS across all namespaces.
#     Default 2400. Kept generous so the bottleneck is clearly the namespace knob.

frontend.namespaceRPS:
  - value: 50
    constraints: {}

frontend.rps:
  - value: 2400
    constraints: {}
