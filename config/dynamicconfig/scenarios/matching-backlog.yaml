# switch scenarios via: make scenario-<name>
# The server watches this file and reloads on change — no restart needed.

# Scenario 2: Matching Backlog / Poller Starvation
# Reduces task queue partitions and persistence QPS to concentrate load.
# Expected: schedule-to-start latency increases, backlog builds on specific partitions.

matching.persistenceMaxQPS:
  - value: 20
    constraints: {}

matching.numTaskqueueWritePartitions:
  - value: 1
    constraints: {}

matching.numTaskqueueReadPartitions:
  - value: 1
    constraints: {}
