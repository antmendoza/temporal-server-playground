# switch scenarios via: make scenario-<name>
# The server watches this file and reloads on change — no restart needed.

# Scenario 3: History Shard Contention
# Reduces history persistence QPS to create artificial contention.
# Expected: persistence_latency on history operations rises,
#           schedule-to-start latency increases for affected workflows.

history.persistenceMaxQPS:
  - value: 20
    constraints: {}
