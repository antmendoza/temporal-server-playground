# Scenario 5: Shard Contention
#
# Unlike other scenarios this one requires a full cluster reinit — shard count
# is baked into the schema at setup time and cannot change at runtime.
#
# To apply:
#   make down
#   NUM_HISTORY_SHARDS=4 make up
#
# Expected: with very few shards many workflows hash to the same shard,
# causing I/O semaphore contention on the history service.
#
# Metrics to watch:
#   semaphore_latency          — time waiting to acquire shard I/O slot
#   semaphore_errors           — failed acquisitions (timeout/cancellation)
#   dd_shard_io_semaphore_latency
#   persistence_latency{service="history"}  — rises as hot shards queue up
#
# Hashing: farm.Fingerprint32(namespaceID + "_" + workflowID) % numShards
# With numShards=4 many workflow IDs collide onto the same shard.
