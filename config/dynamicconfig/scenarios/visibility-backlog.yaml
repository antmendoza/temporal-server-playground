# switch scenarios via: make scenario-<name>
# The server watches this file and reloads on change — no restart needed.

# Scenario 1: Visibility Queue Backlog
# Throttles visibility persistence writes to create indexing lag.
# Expected: task_latency_queue{operation=~"VisibilityTask.*"} climbs,
#           workflows start but don't appear in ListWorkflowExecutions immediately.

system.visibilityPersistenceMaxWriteQPS:
  - value: 5
    constraints: {}
